[project]
name = "piano-backend"
version = "0.1.0"
description = "Backend local : séparation, transcription et post-traitement audio → MIDI piano"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.12",
    "yt-dlp[default]>=2026.10.26",
]

[tool.uv]
default-groups = ["dev", "ml"]
# basic-pitch 0.4 impose TensorFlow 2.14 en Python 3.11, non installable sous Windows.
# On le retire et basic-pitch utilise automatiquement son modèle ONNX (onnxruntime).
override-dependencies = ["tensorflow; sys_platform == 'never'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
# Stack ML lourde, installée par défaut (default-groups). Machine sans GPU ni ML :
# `uv sync --no-group ml`. torch/torchaudio < 2.9 car demucs utilise les backends
# d'écriture torchaudio retirés en 2.9.
ml = [
    "torch>=2.5,<2.9",
    "torchaudio>=2.5,<2.9",
    "demucs>=4.0.1",
    "basic-pitch>=0.4.0",
    "onnxruntime>=1.18",
    # resampy (dépendance de basic-pitch) importe pkg_resources, retiré des setuptools récents.
    "setuptools<81",
    "piano-transcription-inference>=0.0.6",
    "librosa>=0.10",
    "pretty-midi>=0.2.10",
    "mido>=1.3",
    "soundfile>=0.12",
]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests nécessitant Internet (exclus par défaut)",
    "ml: tests nécessitant les modèles ML",
]
addopts = "-m 'not network and not ml'"
